name: group_play_workspace
description: Group Play — phones as synced speakers. A thin Flutter UI over a shared Rust core.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/group_play
  - packages/rust_bridge
  - packages/app_core
  - packages/design_system
  - packages/features/home
  - packages/features/host
  - packages/features/join
  - packages/features/speaker
  - packages/features/settings

dev_dependencies:
  melos: ^8.10.0
  very_good_analysis: ^11.0.0

melos:
  scripts:
    analyze:
      run: flutter analyze .
      description: Static analysis for the whole workspace.
    format:
      run: git ls-files '*.dart' | grep -v '/cargokit/' | grep -v '/src/generated/' | xargs dart format --set-exit-if-changed --output=none
      description: Verify formatting across the workspace.
    test:
      run: melos exec --dir-exists=test --fail-fast --concurrency=1 -- flutter test --no-pub
      description: Run every package's tests.
    bridge:
      run: tool/gen-bindings.sh
      description: Regenerate flutter_rust_bridge bindings from group-play-frb.
    core_test:
      run: cd rust-core && cargo test --workspace
      description: Rust engine unit + end-to-end tests.
