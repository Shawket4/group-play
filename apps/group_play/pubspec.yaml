name: group_play
description: Group Play — every phone in the room plays the same song at the same moment.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.41.0"

dependencies:
  app_core: ^0.1.0
  # Bundles the CupertinoIcons font (fonts ship only from the app's direct dependencies).
  cupertino_icons: ^1.0.8
  design_system: ^0.1.0
  feature_home: ^0.1.0
  feature_host: ^0.1.0
  feature_join: ^0.1.0
  feature_settings: ^0.1.0
  feature_speaker: ^0.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.0
  rust_bridge: ^0.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
