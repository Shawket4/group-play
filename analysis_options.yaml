include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - '**/src/generated/**'
    - '**/cargokit/**'
    - '**/build/**'
    - build/**
    - '**/android/**'
    - '**/ios/**'
    - '**/linux/**'
    - apps/group_play/lib_old/**

linter:
  rules:
    # Workspace packages are not published.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # Riverpod notifiers expose methods; flutter widgets read better without this.
    avoid_positional_boolean_parameters: false
    # Dart 3.13 `new(...)` constructor syntax: not adopted yet.
    unnecessary_type_name_in_constructor: false
