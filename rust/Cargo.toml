[package]
name = "tutti_core"
version = "0.1.0"
edition = "2021"
description = "Tutti engine: clock sync, timeline-locked playback and transport for phones-as-speakers"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Exact pin: the generated Dart code checks this version at startup (same trap as Madar POS / Rawsmith).
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
cpal = "0.18.2"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "vorbis", "ogg", "adpcm"] }
rand = "0.9"
data-encoding = "2"
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
