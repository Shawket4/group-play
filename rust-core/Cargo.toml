[workspace]
resolver = "2"
members = ["crates/group-play-core", "crates/group-play-frb"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }

[profile.release]
lto = "thin"
