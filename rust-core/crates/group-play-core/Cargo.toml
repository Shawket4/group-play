[package]
name = "group-play-core"
description = "Group Play engine: clock sync, timeline-locked playback and transport for phones-as-speakers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "group_play_core"

[dependencies]
anyhow.workspace = true
log.workspace = true
tokio.workspace = true
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
cpal = "0.18.2"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "vorbis", "ogg", "adpcm"] }
data-encoding = "2"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }
